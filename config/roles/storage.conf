# ============================================================
# config/roles/storage.conf
# 스토리지 서버 (nfs, minio, ceph, samba) 역할 기반 임계치 오버라이드
#
# 설계 근거:
#   스토리지 서버의 존재 이유 자체가 디스크입니다.
#   디스크가 가득 차면 다른 모든 서버에 연쇄 장애가 발생합니다.
#   따라서 디스크 임계치를 가장 빡빡하게 설정합니다.
#   Inode도 파일 수가 많을수록 빠르게 소진됩니다.
# ============================================================

cpu_warning=85       # default: 80 — I/O 처리 중 CPU 어느 정도 높아도 됨
cpu_critical=95      # default: 95
memory_warning=80    # default: 80
memory_critical=95   # default: 95
disk_warning=60      # default: 80 — 스토리지는 일찍 경고해야 함
disk_critical=75     # default: 90 — 75%만 차도 CRITICAL
inode_critical=80    # default: 90 — 파일 수가 많아서 Inode 빨리 고갈
