# ============================================================
# config/roles/proxy.conf
# 프록시 / 로드밸런서 (haproxy, nginx LB 모드) 역할 기반 임계치 오버라이드
#
# 설계 근거:
#   프록시 서버는 CPU/메모리보다 네트워크가 핵심입니다.
#   디스크는 거의 쓰지 않으며, CPU와 메모리 사용량은 매우 낮게 유지됩니다.
#   낮은 CPU에서도 네트워크 패킷 처리량이 중요한 지표입니다.
# ============================================================

cpu_warning=70       # default: 80 — 낮은 CPU에서도 민감하게 (높으면 뭔가 이상)
cpu_critical=85      # default: 95
memory_warning=75    # default: 80 — 프록시는 메모리 덜 씀, 높으면 누수 의심
memory_critical=90   # default: 95
disk_warning=85      # default: 80 — 디스크는 거의 안 씀, 여유롭게
disk_critical=95     # default: 90
