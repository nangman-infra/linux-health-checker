# ============================================================
# config/roles/batch.conf
# 배치/잡 서버 (airflow, spark, celery, cron heavy) 역할 기반 임계치 오버라이드
#
# 설계 근거:
#   배치 서버는 특정 시간대에 CPU를 100% 가까이 쓰는 게 정상입니다.
#   잡이 실행 중일 때 높은 Load는 비정상이 아닙니다.
#   반면 잡 결과물/로그가 디스크를 빠르게 잠식하므로 더 민감하게 설정합니다.
# ============================================================

cpu_warning=90       # default: 80 — 배치 실행 중 CPU 100%는 정상
cpu_critical=99      # default: 95
memory_warning=80    # default: 80
memory_critical=95   # default: 95
disk_warning=70      # default: 80 — 잡 아웃풋/로그 빠르게 쌓임
disk_critical=85     # default: 90
load_multiplier=3.0  # default: 1.5 — 배치 중 Load Average 높아도 허용
