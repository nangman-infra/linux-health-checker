# ============================================================
# config/roles/cache.conf
# 캐시 서버 (redis, memcached) 역할 기반 임계치 오버라이드
#
# 설계 근거:
#   캐시 서버는 데이터를 메모리에 올려두는 것 자체가 목적입니다.
#   메모리 95% 사용은 비정상이 아니라 의도된 상태입니다.
#   CPU는 거의 쓰지 않으며, 디스크는 AOF/RDB 스냅샷 정도만 씁니다.
# ============================================================

cpu_warning=80       # default: 80
cpu_critical=95      # default: 95
memory_warning=95    # default: 80 — 캐시가 꽉 차 있는 게 정상
memory_critical=99   # default: 95 — 진짜 99%가 넘으면 eviction 폭발
disk_warning=85      # default: 80 — AOF 로그만 씀, 여유롭게
disk_critical=92     # default: 90
