# ============================================================
# config/roles/web.conf
# 웹 서버 (nginx, apache2, httpd) 역할 기반 임계치 오버라이드
#
# 적용 방법:
#   ./health-check.sh run --role web
#   또는 /etc/health-check.role 에 "web" 기입
#
# 설계 근거:
#   웹 서버는 요청 응답 속도(Latency)에 직결됩니다.
#   CPU가 조금만 올라가도 사용자가 체감하므로 더 민감하게 설정합니다.
# ============================================================

cpu_warning=70       # default: 80 — 응답 속도 민감, 더 빨리 경고
cpu_critical=90      # default: 95
memory_warning=80    # default: 80 — 동일
memory_critical=92   # default: 95 — 웹 서버는 OOM 전에 미리 감지
disk_warning=80      # default: 80 — 로그 파일이 쌓임
disk_critical=90     # default: 90
