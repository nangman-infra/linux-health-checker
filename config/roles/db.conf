# ============================================================
# config/roles/db.conf
# 데이터베이스 서버 (mysql, postgres, mongod, mariadb) 역할 기반 임계치 오버라이드
#
# 설계 근거:
#   DB 서버는 Buffer Pool/Shared Memory로 메모리를 의도적으로 많이 씁니다.
#   메모리 90%는 DB 서버에서 정상 상태입니다.
#   반면 디스크는 데이터 파일이 쌓이므로 더 빨리 경고합니다.
# ============================================================

cpu_warning=85       # default: 80 — 쿼리 처리 중 CPU 높아도 허용
cpu_critical=95      # default: 95
memory_warning=90    # default: 80 — Buffer Pool이 메모리 대부분 차지하는 게 정상
memory_critical=97   # default: 95
disk_warning=70      # default: 80 — 데이터 파일이 빠르게 증가, 더 빠른 경고
disk_critical=85     # default: 90
inode_critical=85    # default: 90 — 소규모 파일(innodb) 많아서 Inode도 빨리 참
