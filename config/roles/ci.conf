# ============================================================
# config/roles/ci.conf
# CI/CD 서버 (jenkins, gitlab-runner, github-runner) 역할 기반 임계치 오버라이드
#
# 설계 근거:
#   CI 서버는 빌드 중에 CPU를 100% 쓰는 게 정상입니다.
#   빌드 아티팩트, 도커 이미지 캐시, 로그가 디스크를 빠르게 잠식합니다.
#   디스크를 일찍 정리하지 않으면 빌드 실패로 직결됩니다.
# ============================================================

cpu_warning=90       # default: 80 — 빌드 중 CPU 스파이크는 정상
cpu_critical=99      # default: 95
memory_warning=80    # default: 80
memory_critical=95   # default: 95
disk_warning=65      # default: 80 — 빌드 아티팩트/이미지 캐시가 빠르게 쌓임
disk_critical=80     # default: 90
inode_critical=85    # default: 90 — 빌드 중 소규모 파일 대량 생성
load_multiplier=2.5  # default: 1.5 — 병렬 빌드 중 높은 Load는 정상
