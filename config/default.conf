# ============================================================
# System Health Checker - Default Configuration
# ============================================================

# --- Execution ---
exec_timeout=60           # 전체 스크립트 최대 실행 시간(초)

# --- Network Timeouts ---
network_timeout=3         # nc 포트 체크 타임아웃(초)
api_timeout=5             # curl 외부 API 타임아웃(초)
ping_timeout=2            # ping 타임아웃(초)
ping_target="8.8.8.8"    # 외부 연결성 확인 대상

# --- Port checks (space-separated) ---
check_ports="22 80 443"

# --- Resource Thresholds ---
cpu_warning=80
cpu_critical=95
memory_warning=80
memory_critical=95
disk_warning=80
disk_critical=90
inode_critical=90

# load average: core_count 대비 배수 초과 시 경고
load_multiplier=1.5

# --- Score Weights (가중치, 높을수록 치명적) ---
weight_disk=5
weight_memory=4
weight_cpu=3
weight_security=4
weight_network=3
weight_load=2
weight_inode=2
